name: Update APT Repository

on:
  schedule:
    - cron: '0 2 * * *' # 每天 UTC 02:00 自动运行
  workflow_dispatch: # 支持在 Actions 界面手动点击触发
    inputs:
      force:
        description: '强制重新构建并部署（即使该版本已发布，用于排错/重建索引）'
        required: false
        default: false
        type: boolean

jobs:
  # 第一步：只算版本号 + 查 gh-pages 上是否已经发布过该版本。
  # 每天定时跑这一步非常便宜（两次 API 请求），避免无意义的全量 cargo build / 重新部署。
  check:
    name: Detect upstream version & skip-if-unchanged
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check_version.outputs.skip }}
      tag: ${{ steps.get_release.outputs.tag }}
      version: ${{ steps.get_release.outputs.version }}
    steps:
      - name: Fetch Latest r-nacos Release Tag
        id: get_release
        run: |
          # 获取官方最新 release tag (如 v0.8.5)
          LATEST_TAG=$(curl -s https://api.github.com/repos/nacos-group/r-nacos/releases/latest | jq -r .tag_name)
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          # 去掉 tag 前面的 v 字母，用纯上游版本号作为包版本（如 0.8.5）。
          # 这样 apt install rnacos=0.8.5 能精确匹配历史版本。
          # 代价：只改了打包脚本而上游没发新版时，已装用户需 apt install --reinstall rnacos 才拿到新打包
          # （不再靠 +sha 自动 bump）；打包改动改为手动 force 重建、覆盖同名 .deb。
          UPSTREAM="${LATEST_TAG#v}"
          echo "version=${UPSTREAM}" >> "$GITHUB_OUTPUT"

      - name: Check if Version Already Published
        id: check_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_release.outputs.version }}"
          # workflow_dispatch 手动触发并勾选 force 时，跳过存在性检查，强制重建
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Force rebuild requested → will build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 查 gh-pages 分支是否已存在该 VERSION 的两个 deb
          # （amd64 + arm64 都在才算"已发布"，避免上一次只发了一半架构时被误判跳过）
          check_deb () {
            curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/pool/main/r/rnacos/rnacos_${VERSION}_${1}.deb?ref=gh-pages"
          }
          AMD64=$(check_deb amd64)
          ARM64=$(check_deb arm64)
          echo "Existence check for $VERSION → amd64 HTTP $AMD64, arm64 HTTP $ARM64"
          if [ "$AMD64" = "200" ] && [ "$ARM64" = "200" ]; then
            echo "Version $VERSION already published → skip build & deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION not fully published → will build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # 第二步：只有版本确实更新了（或手动 force）才会跑，全量 build + 部署。
  build-apt:
    name: Build & publish (skipped when unchanged)
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout local repo (r-nacos-apt)
        uses: actions/checkout@v4

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Clone r-nacos Source Code
        uses: actions/checkout@v4
        with:
          repository: nacos-group/r-nacos
          ref: ${{ needs.check.outputs.tag }}
          path: r-nacos-src

      - name: Install aarch64 Cross Toolchain
        run: |
          # 安装 aarch64 交叉编译工具链（gcc + binutils，含 ar/strip）
          # r-nacos 唯一的 C 依赖是 rusqlite(bundled)，会通过 cc-rs 自动选用下列环境变量
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: Build r-nacos (amd64 + arm64)
        run: |
          cd r-nacos-src
          # amd64: 原生编译
          cargo build --release
          # arm64: 交叉编译到 aarch64-unknown-linux-gnu
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
          export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
          cargo build --release --target aarch64-unknown-linux-gnu

      - name: Setup APT Workspace & Package .deb
        run: |
          VERSION="${{ needs.check.outputs.version }}"

          # 创建目录结构（同时支持 amd64 与 arm64 两套架构索引）
          mkdir -p public/pool/main/r/rnacos
          mkdir -p public/dists/stable/main/binary-amd64
          mkdir -p public/dists/stable/main/binary-arm64

          # 打包函数：$1=架构 $2=编译产物路径
          make_deb () {
            local ARCH="$1"
            local BIN="$2"
            rm -rf deb-build
            mkdir -p deb-build/DEBIAN deb-build/usr/bin deb-build/lib/systemd/system
            # 二进制名保持与上游一致（rnacos），让 apt 装出来的命令和 docker/cargo/brew 等安装方式相同
            cp "$BIN" deb-build/usr/bin/rnacos
            chmod +x deb-build/usr/bin/rnacos
            # Package 名统一为 rnacos（与二进制/上游一致）；Replaces+Conflicts 让已装旧包 r-nacos 的用户
            # 在 apt install rnacos 时自动卸载旧包（含停掉旧的 r-nacos.service），避免两个服务抢端口
            printf 'Package: rnacos\nVersion: %s\nArchitecture: %s\nSection: net\nPriority: optional\nMaintainer: qyzhg <qyzhg@qyzhg.com>\nReplaces: r-nacos\nConflicts: r-nacos\nDescription: Rapid Nacos server implementation in Rust.\n' \
              "$VERSION" "$ARCH" > deb-build/DEBIAN/control
            # 内置 systemd unit + maintainer 脚本：apt 装完即可 systemctl start rnacos
            cp packaging/rnacos.service deb-build/lib/systemd/system/
            cp packaging/postinst deb-build/DEBIAN/postinst
            cp packaging/prerm     deb-build/DEBIAN/prerm
            cp packaging/postrm    deb-build/DEBIAN/postrm
            chmod 0755 deb-build/DEBIAN/postinst deb-build/DEBIAN/prerm deb-build/DEBIAN/postrm
            dpkg-deb --build --root-owner-group deb-build "public/pool/main/r/rnacos/rnacos_${VERSION}_${ARCH}.deb"
          }

          make_deb amd64 r-nacos-src/target/release/rnacos
          make_deb arm64 r-nacos-src/target/aarch64-unknown-linux-gnu/release/rnacos

      - name: Export Public GPG Key
        run: |
          gpg --armor --export > public/KEY.gpg

      - name: Merge historical .deb pool from gh-pages
        run: |
          # 把 gh-pages 上累积的历史 .deb 合并进本次 public/pool/，让下面的索引登记全部版本，
          # 这样 apt install rnacos=<旧版本> 可直接装（不只最新版）。首次发布（无 gh-pages）则跳过。
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages 尚不存在（首次发布）→ 无历史可合并。"
            exit 0
          fi
          git clone --depth=1 -b gh-pages origin /tmp/gh-pages 2>/dev/null
          if [ -d /tmp/gh-pages/pool ]; then
            # -n(no-clobber)：绝不覆盖本次刚构建好的 .deb，只补入历史版本
            cp -an /tmp/gh-pages/pool/. public/pool/ 2>/dev/null || true
            echo "已合并历史 pool，当前 pool 内全部 deb："
            ls -1 public/pool/main/r/rnacos/
          fi

      - name: Generate APT Indexes
        run: |
          cd public

          # 1. 扫描 pool 生成包含全部架构的 Packages，再按 Architecture 字段拆分到各自的索引目录
          #    --multiversion 必须加：两个 deb 的 Package 名都是 rnacos，不加会被当成重复而丢掉其中一个架构
          dpkg-scanpackages --multiversion pool/ /dev/null > /tmp/Packages.all
          awk 'BEGIN{RS=""; ORS="\n\n"} /Architecture: amd64/' /tmp/Packages.all > dists/stable/main/binary-amd64/Packages
          awk 'BEGIN{RS=""; ORS="\n\n"} /Architecture: arm64/' /tmp/Packages.all > dists/stable/main/binary-arm64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-arm64/Packages

          # 2. 生成 Release 元数据文件（Architectures 同时列出两套架构）
          cd dists/stable
          cat <<EOF > Release
          Origin: r-nacos APT Repository
          Label: rnacos Repo
          Suite: stable
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          Description: APT repository for rnacos
          EOF

          # 计算 Packages 等文件的 Hash 并附加到 Release 文件尾部
          apt-ftparchive release . >> Release

          # 3. 使用 GPG 私钥对 Release 进行签名
          gpg --yes --clearsign -o InRelease Release
          gpg --yes -abs -o Release.gpg Release

      - name: Generate landing page
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          # 落地页是装饰性的：模板缺失时只发警告、跳过生成，绝不拖垮整个构建 / APT 发布
          if [ ! -f apt-landing/index.html ]; then
            echo "::warning::apt-landing/index.html 不存在，跳过落地页生成（模板没提交？）。不影响 APT 仓库发布。"
            exit 0
          fi
          # 把模板里的版本号 / 构建日期占位符替换后，落地页与 _headers 一起放进 public/
          # 落地页里的安装命令域名由前端 JS 按当前访问的源动态生成，无需在此写死
          sed -e "s/__RNACOS_VERSION__/${VERSION}/g" \
              -e "s/__BUILD_DATE__/$(date -u +%Y-%m-%d)/g" \
              apt-landing/index.html > public/index.html
          cp apt-landing/_headers public/_headers

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true

  # 第三步：把累积的 gh-pages 镜像到 Cloudflare Pages（给大陆用户加速）。
  # 单独成 job + 只给 contents:read —— 让长生命周期、最敏感的 CF API Token
  # 只暴露在这个最小权限的 job 里：即便 pages-action 被攻陷，也碰不到你的分支 / GitHub Pages / OIDC。
  mirror-to-cloudflare:
    name: Mirror to Cloudflare Pages (best-effort)
    needs: build-apt
    runs-on: ubuntu-latest
    permissions:
      contents: read            # 只需读 gh-pages；CF 上传走 CF API Token，不依赖 GITHUB_TOKEN 权限
    # GitHub Actions 限制：if 条件（job/step 级都是）里一律不能引用 secrets，否则报 Unrecognized named-value: 'secrets'。
    # 所以不做「secret 是否配置」的预判，改用 continue-on-error 兜底：CF 端失败 / secret 缺失都只显示黄色警告，
    # 整个 workflow 仍判绿，主流程（GitHub Pages）不受影响。
    if: ${{ needs.build-apt.result == 'success' }}
    steps:
      - name: Checkout full gh-pages (cumulative)
        uses: actions/checkout@v4
        continue-on-error: true   # gh-pages 拉取失败也不让 workflow 变红
        with:
          ref: gh-pages
          path: cf-mirror

      - name: Mirror to Cloudflare Pages
        if: ${{ hashFiles('cf-mirror/dists/stable/InRelease') != '' }}   # 目录为空绝不部署，避免把 CF 站清空
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true   # CF 端失败不影响整个 workflow：build-apt 已绿 = 主流程成功
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 用 wrangler v4 直传 Pages。pages-action@v1 已停更：它钉死 wrangler v2(EOL)
          # 和 Node 20(已弃用)——日志里那一长串 miniflare v2 / Node 20 deprecation 警告全是它造成的。
          # --branch=main 命中项目 production 分支 → 生产部署（项目里 production branch 也要设成 main）
          command: pages deploy cf-mirror --project-name=rnacos-apt --branch=main
