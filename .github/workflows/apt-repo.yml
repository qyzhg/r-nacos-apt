name: Update APT Repository

on:
  schedule:
    - cron: '0 2 * * *' # 每天 UTC 02:00 自动运行
  workflow_dispatch: # 支持在 Actions 界面手动点击触发
    inputs:
      force:
        description: '强制重新构建并部署（即使该版本已发布，用于排错/重建索引）'
        required: false
        default: false
        type: boolean

jobs:
  # 第一步：只算版本号 + 查 gh-pages 上是否已经发布过该版本。
  # 每天定时跑这一步非常便宜（两次 API 请求），避免无意义的全量 cargo build / 重新部署。
  check:
    name: Detect upstream version & skip-if-unchanged
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check_version.outputs.skip }}
      tag: ${{ steps.get_release.outputs.tag }}
      version: ${{ steps.get_release.outputs.version }}
    steps:
      - name: Fetch Latest r-nacos Release Tag
        id: get_release
        run: |
          # 获取官方最新 release tag (如 v0.8.5)
          LATEST_TAG=$(curl -s https://api.github.com/repos/nacos-group/r-nacos/releases/latest | jq -r .tag_name)
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          # 去掉 tag 前面的 v 字母，获取纯版本号 (如 0.8.5)
          UPSTREAM="${LATEST_TAG#v}"
          # 末尾追加本仓库(r-nacos-apt)的短 commit hash：每次改了打包/工作流版本号都会变，
          # 已装的用户可通过 apt upgrade 拉到新包（0.8.5+<sha> 比 0.8.5 新）
          echo "version=${UPSTREAM}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Check if Version Already Published
        id: check_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_release.outputs.version }}"
          # workflow_dispatch 手动触发并勾选 force 时，跳过存在性检查，强制重建
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Force rebuild requested → will build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 查 gh-pages 分支是否已存在该 VERSION 的两个 deb
          # （amd64 + arm64 都在才算"已发布"，避免上一次只发了一半架构时被误判跳过）
          check_deb () {
            curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/pool/main/r/rnacos/rnacos_${VERSION}_${1}.deb?ref=gh-pages"
          }
          AMD64=$(check_deb amd64)
          ARM64=$(check_deb arm64)
          echo "Existence check for $VERSION → amd64 HTTP $AMD64, arm64 HTTP $ARM64"
          if [ "$AMD64" = "200" ] && [ "$ARM64" = "200" ]; then
            echo "Version $VERSION already published → skip build & deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION not fully published → will build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # 第二步：只有版本确实更新了（或手动 force）才会跑，全量 build + 部署。
  build-apt:
    name: Build & publish (skipped when unchanged)
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout local repo (r-nacos-apt)
        uses: actions/checkout@v4

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Clone r-nacos Source Code
        uses: actions/checkout@v4
        with:
          repository: nacos-group/r-nacos
          ref: ${{ needs.check.outputs.tag }}
          path: r-nacos-src

      - name: Install aarch64 Cross Toolchain
        run: |
          # 安装 aarch64 交叉编译工具链（gcc + binutils，含 ar/strip）
          # r-nacos 唯一的 C 依赖是 rusqlite(bundled)，会通过 cc-rs 自动选用下列环境变量
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: Build r-nacos (amd64 + arm64)
        run: |
          cd r-nacos-src
          # amd64: 原生编译
          cargo build --release
          # arm64: 交叉编译到 aarch64-unknown-linux-gnu
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
          export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
          cargo build --release --target aarch64-unknown-linux-gnu

      - name: Setup APT Workspace & Package .deb
        run: |
          VERSION="${{ needs.check.outputs.version }}"

          # 创建目录结构（同时支持 amd64 与 arm64 两套架构索引）
          mkdir -p public/pool/main/r/rnacos
          mkdir -p public/dists/stable/main/binary-amd64
          mkdir -p public/dists/stable/main/binary-arm64

          # 打包函数：$1=架构 $2=编译产物路径
          make_deb () {
            local ARCH="$1"
            local BIN="$2"
            rm -rf deb-build
            mkdir -p deb-build/DEBIAN deb-build/usr/bin deb-build/lib/systemd/system
            # 二进制名保持与上游一致（rnacos），让 apt 装出来的命令和 docker/cargo/brew 等安装方式相同
            cp "$BIN" deb-build/usr/bin/rnacos
            chmod +x deb-build/usr/bin/rnacos
            # Package 名统一为 rnacos（与二进制/上游一致）；Replaces+Conflicts 让已装旧包 r-nacos 的用户
            # 在 apt install rnacos 时自动卸载旧包（含停掉旧的 r-nacos.service），避免两个服务抢端口
            printf 'Package: rnacos\nVersion: %s\nArchitecture: %s\nSection: net\nPriority: optional\nMaintainer: qyzhg <qyzhg@qyzhg.com>\nReplaces: r-nacos\nConflicts: r-nacos\nDescription: Rapid Nacos server implementation in Rust.\n' \
              "$VERSION" "$ARCH" > deb-build/DEBIAN/control
            # 内置 systemd unit + maintainer 脚本：apt 装完即可 systemctl start rnacos
            cp packaging/rnacos.service deb-build/lib/systemd/system/
            cp packaging/postinst deb-build/DEBIAN/postinst
            cp packaging/prerm     deb-build/DEBIAN/prerm
            cp packaging/postrm    deb-build/DEBIAN/postrm
            chmod 0755 deb-build/DEBIAN/postinst deb-build/DEBIAN/prerm deb-build/DEBIAN/postrm
            dpkg-deb --build --root-owner-group deb-build "public/pool/main/r/rnacos/rnacos_${VERSION}_${ARCH}.deb"
          }

          make_deb amd64 r-nacos-src/target/release/rnacos
          make_deb arm64 r-nacos-src/target/aarch64-unknown-linux-gnu/release/rnacos

      - name: Export Public GPG Key
        run: |
          gpg --armor --export > public/KEY.gpg

      - name: Generate APT Indexes
        run: |
          cd public

          # 1. 扫描 pool 生成包含全部架构的 Packages，再按 Architecture 字段拆分到各自的索引目录
          #    --multiversion 必须加：两个 deb 的 Package 名都是 rnacos，不加会被当成重复而丢掉其中一个架构
          dpkg-scanpackages --multiversion pool/ /dev/null > /tmp/Packages.all
          awk 'BEGIN{RS=""; ORS="\n\n"} /Architecture: amd64/' /tmp/Packages.all > dists/stable/main/binary-amd64/Packages
          awk 'BEGIN{RS=""; ORS="\n\n"} /Architecture: arm64/' /tmp/Packages.all > dists/stable/main/binary-arm64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-arm64/Packages

          # 2. 生成 Release 元数据文件（Architectures 同时列出两套架构）
          cd dists/stable
          cat <<EOF > Release
          Origin: r-nacos APT Repository
          Label: rnacos Repo
          Suite: stable
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          Description: APT repository for rnacos
          EOF

          # 计算 Packages 等文件的 Hash 并附加到 Release 文件尾部
          apt-ftparchive release . >> Release

          # 3. 使用 GPG 私钥对 Release 进行签名
          gpg --yes --clearsign -o InRelease Release
          gpg --yes -abs -o Release.gpg Release

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
